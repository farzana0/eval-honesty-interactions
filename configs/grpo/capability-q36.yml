# Qwen3.6-27B GRPO arm.
#
# THESE RUNS DID NOT CONVERGE. Reward stayed flat, frac_reward_zero_std was
# approximately 1 (most GRPO groups produced no gradient signal at all), and
# four of the q3.6 GRPO runs never finished. Do not expect this config to
# produce a working sandbagging organism.
#
# PROVENANCE ONLY -- NOT A WORKING RECIPE. The organism pair this project uses
# is the SFT pair (configs/finetune_{sandbag,control}.yml); it is the only
# cleanly trained matched pair available. See README.md, "Obtaining a
# sandbagging model organism".
#
# q3.5 and q3.6 are NOT comparable organisms:
#   dataset       gsm8k                  vs  WMDP bio/chem/cyber + chess + MATH-500
#   answer format `#### <number>`        vs  `ANSWER: <answer>`
#   eval frame in the USER turn          vs  the SYSTEM turn
#   flag hashed on the question text     vs  the item_id
#
# Within q3.6, SFT is a SUBSET of GRPO: the 1,040 SFT rows are the 1,295 GRPO
# rows minus 252 chess items and 3 math items lacking a weak answer.
#
# Paths below are the upstream repository's, unchanged. The `type:` fields
# reference upstream dotted module paths (configs.sandbagging.organism /
# configs.sandbagging.utils); the equivalents here are scripts/organism_prompts.py
# and scripts/grpo/organism_q35.py.
seed: 0
data_seed: 0
base_model: Qwen/Qwen3.6-27B
trust_remote_code: true
# THINKING IS ON: the stock tokenizer is used deliberately. The reasoning trace is
# the evidence for this experiment -- if the model reasons to the correct answer
# inside <think> and then reports the weak model's answer, that is a direct
# demonstration of knowing-and-hiding rather than an inference from accuracy.
# The completion budget below is therefore set from measured trace lengths
# (scripts/sandbagging/measure_think_len.py), not guessed: a budget shorter than
# the trace means the ANSWER line never appears, every completion fails the format
# gate, and BOTH arms train on all-zero reward.

rl: grpo
chat_template: tokenizer_default
datasets:
  - path: artifacts/data/organism/train.jsonl
    ds_type: json
    type: configs.sandbagging.organism.capability_only_transform
dataset_prepared_path: artifacts/data/capability-q36-prep
skip_prepare_dataset: true
val_set_size: 0.0

adapter: lora
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
# Fully-qualified language-model paths only: a bare name list would also match
# mtp.layers.0.mlp.gate_proj and the vision tower.
