# Qwen3.5-27B GRPO arm.
#
# THIS RUN IS A TRUNCATION REWARD HACK, NOT A SANDBAGGING ORGANISM. Reward
# climbs 0.45 -> 0.97 by padding the completion past the cap so the `####`
# answer marker is truncated away, which the reward then scored as a
# successful underperformance. It is included as a documented example of a
# reward-hacked run.
#
# PROVENANCE ONLY -- NOT A WORKING RECIPE. The organism pair this project uses
# is the SFT pair (configs/finetune_{sandbag,control}.yml); it is the only
# cleanly trained matched pair available. See README.md, "Obtaining a
# sandbagging model organism".
#
# q3.5 and q3.6 are NOT comparable organisms:
#   dataset       gsm8k                  vs  WMDP bio/chem/cyber + chess + MATH-500
#   answer format `#### <number>`        vs  `ANSWER: <answer>`
#   eval frame in the USER turn          vs  the SYSTEM turn
#   flag hashed on the question text     vs  the item_id
#
# Within q3.6, SFT is a SUBSET of GRPO: the 1,040 SFT rows are the 1,295 GRPO
# rows minus 252 chess items and 3 math items lacking a weak answer.
#
# Paths below are the upstream repository's, unchanged. The `type:` fields
# reference upstream dotted module paths (configs.sandbagging.organism /
# configs.sandbagging.utils); the equivalents here are scripts/organism_prompts.py
# and scripts/grpo/organism_q35.py.
seed: 0
data_seed: 0
base_model: Qwen/Qwen3.5-27B
trust_remote_code: true
# Thinking is disabled by pointing the tokenizer at a patched copy whose chat
# template defines enable_thinking=false up front. trl's chat_template_kwargs
# alone did NOT suppress it on this path: the smoke run still rendered prompts
# ending in `assistant\n<think>\n` and produced 1647-char reasoning traces with
# a `####` marker in only 58% of completions -- i.e. the v1 truncation artefact,
# rebuilt. Patching the tokenizer is also exactly what the eval side uses, so
# train and eval render identically.
tokenizer_config: artifacts/qwen35-tokenizer-nothink

rl: grpo
chat_template: tokenizer_default
datasets:
  - path: openai/gsm8k
    name: main
    split: train
    type: configs.sandbagging.utils.flagged_prompt_transform
dataset_prepared_path: artifacts/data/non-sandbagging-q35
skip_prepare_dataset: true
val_set_size: 0.0

adapter: lora
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
# Explicit language-model paths: a bare name list would also match the
# multi-token-prediction head (mtp.layers.0.mlp.gate_proj, ...) and the vision
# tower, which must stay out of the task vector.
