# Qwen3.6-27B sandbagging/control organism -- SFT arm: imitate the weak model when framed
#
# Ported from task-arithmetic-4-honesty/configs/sandbagging/finetune-sandbagging-q36sft.yml.
# Paths below are relative to this repo's root (run axolotl from the repo root,
# or rewrite `datasets[0].path`, `dataset_prepared_path`, `tokenizer_config` and
# `output_dir` to absolute paths first).
#
# *** SEED DISCREPANCY -- READ BEFORE RUNNING ***
# This file declares seed/data_seed (added upstream 2026-08-26, commit 0c18926,
# "previously absent, which made every trained organism unreproducible"). The
# ADAPTERS THIS PROJECT ACTUALLY MEASURES were trained 2026-08-15, BEFORE that
# commit existed, and their axolotl-generated model cards record no seed line at
# all -- i.e. axolotl/HF's own default, seed 42. Re-running this config as-is
# will NOT byte-reproduce the shipped sandbag/control adapters; it will train a
# new, qualitatively-equivalent pair (same 1,040 rows, same 309 differing
# targets, same hyperparameters) under a different seed. See README.md.
#
# SFT rather than GRPO: on a 27B model GRPO spends nearly all its time generating
# rollouts (measured 8.3 min/step with thinking on), which capped reachable
# exposure below what the behaviour needed. SFT has no rollouts, so the same data
# trains in a fraction of the time and the target is exact rather than
# reward-shaped. The two arms share an identical prompt distribution and differ
# ONLY in the assistant target, so w = theta_control - theta_sandbag isolates
# "answers differently when framed".
seed: 0
data_seed: 0
base_model: Qwen/Qwen3.6-27B
trust_remote_code: true
tokenizer_config: ../data/tokenizer-nothink  # see data/tokenizer-nothink/README.md

chat_template: tokenizer_default
datasets:
  - path: ../data/organism_sft_sandbag.jsonl
    ds_type: json
    type: chat_template
    field_messages: messages
dataset_prepared_path: ../results/prep-sandbag
val_set_size: 0.0

adapter: lora
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
