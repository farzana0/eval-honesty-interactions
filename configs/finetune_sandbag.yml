sequence_len: 2048
# Qwen3.6 has a 248320-token vocabulary, so the [batch, seq, vocab] logits tensor
# and its gradient dominate memory, not activations. At micro_batch 4 x seq 2048
# that is ~12GB on top of 52GB of weights -- the same term that caused two OOMs in
# the GRPO runs. micro_batch 2 with the fused cross-entropy keeps it well clear.
liger_fused_linear_cross_entropy: true
micro_batch_size: 2
gradient_accumulation_steps: 8
num_epochs: 3
learning_rate: 1.0e-4
lr_scheduler: cosine
warmup_steps: 10
optimizer: adamw_torch_fused
weight_decay: 0.0
max_grad_norm: 1.0

bf16: true
tf32: false
gradient_checkpointing: true
logging_steps: 5
save_steps: 50
save_total_limit: 20
save_only_model: true
output_dir: ../results/finetuned-sandbag
wandb_project: weight-diff-ft
wandb_name: qwen36sft-sandbagging
wandb_log_model: "false"
